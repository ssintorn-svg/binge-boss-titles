name: Title pages (daily, Groq free tier)

# Writes and reviews new title-page texts and refreshes pre-release ones on
# Groq's free tier, then commits them to the private binge-boss repository.
# Its daily content update (05:17 UTC) builds /watch/ and deploys; only texts
# that passed review are shown (scripts/title-pages-index.cjs there).
# Auto-publishing of title pages approved by the owner on 2026-10-15.
#
# Runs here, in a public repository, because public repositories get GitHub
# Actions minutes for free (moved 2026-11-23). Starts at 00:23 so that even a
# run hitting the 4-hour limit ends before the 05:17 build.

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'New titles to write (budget permitting)'
        default: '24'

permissions:
  contents: write   # only for the keep-alive commit in this repository

env:
  # No __pycache__ in the checkout: stray files there stopped the commit on 2026-10-16.
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: titles-daily
  cancel-in-progress: false

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the private repository
        uses: actions/checkout@v4
        with:
          repository: ssintorn-svg/binge-boss
          ssh-key: ${{ secrets.BINGE_BOSS_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write, review and refresh title texts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./scripts/titles-daily.sh "${{ github.event.inputs.max_new || '24' }}"

      - name: Commit texts to the private repository
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/title-descriptions.json data/title-facts.json data/title-prerelease.json data/title-ranking.json data/title-daily-report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Title texts $(date -u '+%Y-%m-%d') (Groq)"
            git pull --rebase --autostash -q && git push
          fi

      - name: Status email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          DEPLOY_OUTCOME: skipped
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f data/title-daily-report.json ] && node scripts/title-status-mail.cjs || echo "no report"

      # GitHub turns off scheduled workflows in a public repository after 60
      # days without commits. The job pushes to the other repository, so it
      # commits here about once a month.
      - name: Keep the schedule alive
        if: always()
        uses: actions/checkout@v4
        with:
          path: keepalive
      - if: always()
        working-directory: keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u '+%Y-%m-%dT%H:%M:%SZ' > last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-run.txt && git commit -qm "Keep-alive $(date -u '+%Y-%m-%d')" && git push -q
          fi
